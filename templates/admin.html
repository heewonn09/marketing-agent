<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 대시보드 — Marketing Agent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f7fafc; color: #2d3748; min-height: 100vh; }
  .topbar { background: #1a202c; color: white; padding: 14px 24px;
            display: flex; align-items: center; gap: 12px; }
  .topbar-title { font-weight: 700; font-size: 15px; }
  .topbar-sub { font-size: 12px; color: #a0aec0; }
  .topbar a { margin-left: auto; color: #90cdf4; font-size: 13px; text-decoration: none; }
  .content { max-width: 900px; margin: 32px auto; padding: 0 20px; }
  h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #1a202c; }
  .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
           padding: 20px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700;
       color: #a0aec0; text-transform: uppercase; letter-spacing: 0.05em;
       border-bottom: 2px solid #edf2f7; }
  td { padding: 10px 12px; border-bottom: 1px solid #f7fafc; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f7fafc; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .badge.admin   { background: #ebf8ff; color: #2b6cb0; }
  .badge.user    { background: #f0fff4; color: #276749; }
  .badge.starter { background: #faf5ff; color: #6b46c1; }
  .badge.pro     { background: #fffaf0; color: #c05621; }
  .badge.agency  { background: #fff5f5; color: #9b2c2c; }
  .badge.on  { background: #f0fff4; color: #276749; }
  .badge.off { background: #fff5f5; color: #9b2c2c; }
  .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer;
         font-size: 12px; font-weight: 600; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.8; }
  .btn-danger  { background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; }
  .btn-toggle  { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
  .btn-primary { background: #3182ce; color: white; border: none; }
  form.add-form { display: grid; grid-template-columns: 1fr 1fr 120px 120px auto; gap: 10px; align-items: end; }
  label { display: block; font-size: 11px; font-weight: 600; color: #718096; margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0;
                  border-radius: 6px; font-size: 13px; outline: none; }
  input:focus, select:focus { border-color: #3182ce; }
  #msg { font-size: 13px; margin-top: 12px; min-height: 20px; }
  .msg-ok  { color: #276749; }
  .msg-err { color: #e53e3e; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="topbar-title">Marketing Agent — 관리자</div>
    <div class="topbar-sub">사용자 관리 대시보드</div>
  </div>
  <a href="/">← 메인으로</a>
</div>

<div class="content">
  <div class="card">
    <h2>사용자 추가</h2>
    <form class="add-form" onsubmit="createUser(event)">
      <div>
        <label>사용자명</label>
        <input id="new-username" placeholder="username" required>
      </div>
      <div>
        <label>비밀번호</label>
        <input id="new-password" type="password" placeholder="••••••" required>
      </div>
      <div>
        <label>플랜</label>
        <select id="new-plan">
          <option value="starter">Starter</option>
          <option value="pro">Pro</option>
          <option value="agency">Agency</option>
        </select>
      </div>
      <div>
        <label>역할</label>
        <select id="new-role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button type="submit" class="btn btn-primary">추가</button>
      </div>
    </form>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>사용자 목록</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>사용자명</th><th>역할</th><th>플랜</th><th>상태</th><th>가입일</th><th>작업</th>
        </tr>
      </thead>
      <tbody id="user-table"></tbody>
    </table>
  </div>
</div>

<script>
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let _csrfToken = '';
  function csrfFetch(url, options = {}) {
    const method = (options.method || 'GET').toUpperCase();
    if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
      options.headers = Object.assign({ 'X-CSRF-Token': _csrfToken }, options.headers || {});
    }
    return fetch(url, options);
  }

  async function loadUsers() {
    const r = await fetch('/admin/users');
    if (!r.ok) return;
    const { users } = await r.json();
    const tbody = document.getElementById('user-table');
    tbody.innerHTML = users.map(u => `
      <tr id="row-${u.id}">
        <td>${u.id}</td>
        <td><strong>${esc(u.username)}</strong></td>
        <td><span class="badge ${u.role}">${u.role}</span></td>
        <td><span class="badge ${u.plan}">${u.plan}</span></td>
        <td><span class="badge ${u.enabled ? 'on' : 'off'}">${u.enabled ? '활성' : '비활성'}</span></td>
        <td style="font-size:11px;color:#a0aec0">${(u.created_at||'').slice(0,10)}</td>
        <td style="display:flex;gap:6px">
          <button class="btn btn-toggle" onclick="toggleUser(${u.id}, ${!u.enabled})">
            ${u.enabled ? '비활성화' : '활성화'}
          </button>
          <button class="btn btn-danger" onclick="deleteUser(${u.id}, '${esc(u.username)}')">삭제</button>
        </td>
      </tr>
    `).join('');
  }

  async function createUser(e) {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const r = await csrfFetch('/admin/users', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('new-username').value,
        password: document.getElementById('new-password').value,
        plan:     document.getElementById('new-plan').value,
        role:     document.getElementById('new-role').value,
      }),
    });
    const data = await r.json();
    if (r.ok) {
      msg.textContent = `사용자 '${data.username}' 추가 완료 (ID: ${data.id})`;
      msg.className = 'msg-ok';
      document.getElementById('new-username').value = '';
      document.getElementById('new-password').value = '';
      loadUsers();
    } else {
      msg.textContent = data.error || '오류 발생';
      msg.className = 'msg-err';
    }
    setTimeout(() => { msg.textContent = ''; }, 4000);
  }

  async function toggleUser(uid, enable) {
    await csrfFetch(`/admin/users/${uid}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({enabled: enable}),
    });
    loadUsers();
  }

  async function deleteUser(uid, username) {
    if (!confirm(`'${username}' 사용자를 삭제하시겠습니까?\n이 사용자의 잡 기록은 유지됩니다.`)) return;
    await csrfFetch(`/admin/users/${uid}`, {method: 'DELETE'});
    loadUsers();
  }

  fetch('/csrf-token').then(r => r.json()).then(({ token }) => { _csrfToken = token; });
  loadUsers();
</script>
</body>
</html>
