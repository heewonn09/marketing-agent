<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — Marketing Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 24px;
    }
    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e143c;
    }
    .logo p {
      font-size: 13px;
      color: #8070a0;
      margin-top: 4px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a3070;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e0d8f0;
      border-radius: 10px;
      font-size: 15px;
      color: #1e143c;
      background: #faf8ff;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: #764ba2;
      background: #fff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcdd2;
      border-radius: 8px;
      color: #c62828;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <h1>Marketing Agent</h1>
      <p>마케팅 자동화 대시보드</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" placeholder="관리자 아이디" autofocus required>

      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" placeholder="비밀번호" required>

      <button type="submit" class="btn">로그인</button>
    </form>
  </div>
</body>
</html>
